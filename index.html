<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffcdb5">
<title>구슬 팡팡 - 우리 문화재 나들이</title>
<meta name="description" content="누르면 쨍그랑 깨지는 구슬 게임. 판을 깰 때마다 숭례문, 첨성대, 경회루 같은 우리 문화재가 열려요. 설치 없이 무료로 바로 즐겨요.">
<meta property="og:title" content="구슬 팡팡 - 우리 문화재 나들이">
<meta property="og:description" content="누르면 쨍그랑 깨지는 구슬 게임. 판을 깰 때마다 우리 문화재가 열려요. 설치 없이 무료.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://1000poong-dot.github.io/gusul-pangpang/">
<meta property="og:image" content="https://1000poong-dot.github.io/gusul-pangpang/preview.jpg">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #ffd9c0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  button { font: inherit; -webkit-tap-highlight-color: transparent; }
  .pill { background: rgba(255,255,255,.84); border-radius: 999px; box-shadow: 0 3px 12px rgba(60,30,80,.2); color: #4b3f6b; }

  /* 상단 정보 */
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top)) 10px 0;
         display: none; flex-direction: column; gap: 6px; pointer-events: none; }
  #hud.on { display: flex; }
  #hud .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #info { padding: 6px 16px 8px; border-radius: 18px; min-width: 140px; }
  #stageNm { font-size: 13px; font-weight: 800; color: #7a4fd6; white-space: nowrap; }
  #goalTxt { font-size: 18px; font-weight: 800; }
  #scoreTxt { font-size: 12px; color: #8a80a8; font-weight: 700; margin-left: 6px; }
  .bar { height: 8px; border-radius: 8px; background: rgba(120,100,160,.2); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg,#7ee0c3,#47b8ff); transition: width .15s; }
  #sound { display: flex; align-items: center; gap: 2px; padding: 3px 12px 3px 3px; pointer-events: auto; }
  #sound button { width: 42px; height: 42px; border: 0; border-radius: 50%; background: transparent; font-size: 21px; cursor: pointer; padding: 0; }
  #sound button:active { background: rgba(160,120,220,.2); }
  #sound button.off { opacity: .35; filter: grayscale(1); }
  #vol { width: 92px; accent-color: #a06bff; cursor: pointer; margin: 0 0 0 4px; }
  #danger { align-self: center; width: min(440px, 74vw); padding: 5px 16px 7px; text-align: center; border-radius: 16px; transition: box-shadow .2s; }
  #dangerTxt { font-size: 13px; font-weight: 800; }
  #danger .bar { height: 10px; }
  #danger.hot { animation: hot .5s ease-in-out infinite alternate; color: #d81b3c; }
  @keyframes hot { from { box-shadow: 0 0 0 rgba(255,40,60,0); transform: scale(1); } to { box-shadow: 0 0 22px rgba(255,40,60,.75); transform: scale(1.04); } }

  /* 신기전 버튼 */
  #rocketBtn { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom));
    display: none; flex-direction: column; align-items: center; justify-content: center;
    width: 86px; height: 86px; border: 0; border-radius: 50%; cursor: pointer; color: #5a1d00; font-weight: 800;
    background: radial-gradient(circle at 35% 30%, #fff5c9, #ffb347 55%, #e8552c);
    box-shadow: 0 6px 18px rgba(200,70,20,.45), inset 0 -5px 10px rgba(150,40,0,.25); }
  #rocketBtn.on { display: flex; }
  #rocketBtn .ic { font-size: 30px; line-height: 1; }
  #rocketBtn .n { font-size: 15px; margin-top: 2px; }
  #rocketBtn small { position: absolute; bottom: -20px; white-space: nowrap; font-size: 12px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #rocketBtn.empty { filter: grayscale(.85); opacity: .65; }
  #rocketBtn.nope { animation: nope .3s; }
  @keyframes nope { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* 기생 */
  #gis { position: fixed; left: calc(1vw + env(safe-area-inset-left)); bottom: 0; height: min(46vh, 390px);
         pointer-events: none; transform: translateY(110%); transition: transform .55s cubic-bezier(.2,1.35,.4,1); }
  #gis.show { transform: translateY(0); }
  #gis.peek { height: min(30vh, 250px); }
  #gis svg { height: 100%; width: auto; display: block; overflow: visible; }
  .gs-body { transform-box: view-box; transform-origin: 120px 336px; animation: gsway 1.3s ease-in-out infinite alternate; }
  .gs-arm  { transform-box: view-box; transform-origin: 150px 124px; animation: gfan .42s ease-in-out infinite alternate; }
  #gis:not(.show) .gs-body, #gis:not(.show) .gs-arm { animation-play-state: paused; }
  @keyframes gsway { from { transform: rotate(-3.5deg); } to { transform: rotate(3.5deg) translateY(-4px); } }
  @keyframes gfan { from { transform: rotate(-16deg); } to { transform: rotate(10deg); } }
  #talk { position: absolute; left: 70%; top: 0; width: max-content; max-width: 46vw; padding: 10px 16px;
          background: #fff; border-radius: 20px; font-size: clamp(17px, 4.4vw, 25px); font-weight: 800; color: #d62a63;
          box-shadow: 0 6px 18px rgba(120,20,60,.25); transform-origin: 0 100%; animation: talkpop .45s cubic-bezier(.2,1.5,.4,1); }
  #talk::before { content: ""; position: absolute; left: 10px; bottom: -10px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
  #gis.peek #talk { font-size: clamp(15px, 3.8vw, 21px); }
  @keyframes talkpop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* 카드 */
  .card { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); width: min(470px, 92vw); box-sizing: border-box;
          padding: 16px 20px 18px; border-radius: 26px; background: rgba(255,255,255,.92); box-shadow: 0 14px 44px rgba(60,20,90,.35);
          text-align: center; color: #3f3360; opacity: 0; pointer-events: none; transform: translate(-50%, -24px);
          transition: opacity .4s, transform .5s cubic-bezier(.2,1.4,.4,1); }
  .card.on { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .card h2 { margin: 0 0 4px; font-size: clamp(26px, 7vw, 36px); color: #e0306b; }
  .stats { font-size: 14px; color: #6c6290; line-height: 1.5; }
  .heritage { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .8s ease, opacity .8s ease, margin .8s; }
  .heritage.on { max-height: 260px; opacity: 1; margin-top: 10px; }
  .tag { display: inline-block; font-size: 13px; font-weight: 800; color: #fff; background: linear-gradient(90deg,#e8a317,#ff7a3d); border-radius: 999px; padding: 3px 12px; }
  .hn { font-size: clamp(28px, 8vw, 40px); font-weight: 900; color: #5a3fc0; margin: 6px 0 2px; letter-spacing: .02em; }
  .hd { font-size: 15px; line-height: 1.55; word-break: keep-all; }
  .btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .big { border: 0; border-radius: 999px; padding: 14px 28px; font-size: 21px; font-weight: 800; color: #fff; cursor: pointer;
         background: linear-gradient(135deg,#ff6fa5,#a06bff); box-shadow: 0 6px 16px rgba(160,80,220,.4); }
  .big:active { transform: scale(.95); }
  .big.gray { background: linear-gradient(135deg,#a3abbd,#707a94); box-shadow: 0 6px 16px rgba(80,90,120,.35); }
  #nextBtn { visibility: hidden; opacity: 0; transition: opacity .4s; }
  #nextBtn.on { visibility: visible; opacity: 1; animation: breathe 1.1s ease-in-out infinite; }
  @media (min-aspect-ratio: 1/1) and (min-width: 760px) {
    .card { left: auto; right: calc(2vw + env(safe-area-inset-right)); top: 140px; width: min(380px, 31vw); transform: translate(0, -24px); }
    .card.on { transform: translate(0, 0); }
  }
  #hud.calm #danger { visibility: hidden; }

  /* 첫 화면 */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
           background: rgba(255,255,255,.18); transition: opacity .35s; }
  #start.off { opacity: 0; pointer-events: none; }
  #start h1 { margin: 0; font-size: clamp(40px, 11vw, 74px); font-weight: 900; letter-spacing: .04em; color: #7a4fd6;
              text-shadow: 0 4px 0 #fff, 0 8px 20px rgba(120,60,200,.35); }
  #start .sub { margin: -14px 0 0; font-size: clamp(16px, 4.4vw, 22px); font-weight: 800; color: #b0306a; text-shadow: 0 2px 0 #fff; }
  #go { border: 0; cursor: pointer; width: min(58vw, 250px); height: min(58vw, 250px); max-width: 40vh; max-height: 40vh; border-radius: 50%;
        font-size: clamp(34px, 10vw, 58px); font-weight: 900; color: #fff;
        background: radial-gradient(circle at 35% 30%, #ffd0e6 0%, #ff7fb4 38%, #9d6bff 100%);
        box-shadow: 0 14px 34px rgba(150,90,240,.45), inset 0 -8px 18px rgba(90,60,200,.25); text-shadow: 0 2px 6px rgba(90,60,180,.4);
        animation: breathe 2.2s ease-in-out infinite; }
  #go:active { transform: scale(.94); animation: none; }
  #bestTxt { font-size: 15px; font-weight: 700; color: #5b4a86; background: rgba(255,255,255,.75); border-radius: 999px; padding: 5px 14px; }
  #bestTxt:empty { display: none; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { #go, #nextBtn.on { animation: none; } }
  @media (max-aspect-ratio: 1/1) {
    #gis { height: min(34vh, 300px); }
    #gis.peek { height: min(21vh, 180px); }
    #talk { left: 62%; max-width: 62vw; }
  }
  @media (max-width: 400px) { #vol { width: 64px; } #sound button { width: 38px; height: 38px; } #info { min-width: 0; } }
</style>
</head>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var PI2 = Math.PI * 2, rand = Math.random;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function pick(a) { return a[(rand() * a.length) | 0]; }
  var reduced = false, coarse = false;
  try { reduced = matchMedia('(prefers-reduced-motion: reduce)').matches; coarse = matchMedia('(pointer: coarse)').matches; } catch (e) {}
  var quality = reduced ? 0.6 : 1;
  var W = 0, H = 0, DPR = 1, baseR = 50, TOP = 0, M = 16, capF = 1;

  /* =========================================================
     1. 배경 - 우리 문화재 (그림 파일 없이 직접 그림)
     ========================================================= */
  function srand(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function poly(c, p, fill) {
    c.beginPath(); c.moveTo(p[0], p[1]);
    for (var i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]);
    c.closePath(); if (fill) { c.fillStyle = fill; c.fill(); }
  }
  function box(c, x0, y0, x1, y1, fill) { c.fillStyle = fill; c.fillRect(x0, y0, x1 - x0, y1 - y0); }
  function ln(c, x0, y0, x1, y1) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }
  function circ(c, x, y, r, fill) { c.fillStyle = fill; c.beginPath(); c.arc(x, y, r, 0, PI2); c.fill(); }
  function bricks(c, x0, y0, x1, y1, rh, col) {
    c.save(); c.beginPath(); c.rect(x0, y0, x1 - x0, y1 - y0); c.clip();
    c.strokeStyle = col; c.lineWidth = rh * 0.12;
    for (var y = y1, row = 0; y > y0; y -= rh, row++) {
      ln(c, x0, y, x1, y);
      var bw = rh * 2.2;
      for (var x = x0 + (row % 2) * bw / 2; x < x1; x += bw) ln(c, x, y, x, y - rh);
    }
    c.restore();
  }
  var ROOF = ['#4d576a', '#2c323e', '#22272f'], ROOF_N = ['#343c5c', '#1c2138', '#151a2a'];
  function roof(c, cx, by, w, h, col) {
    var hw = w / 2, lift = h * 0.4;
    c.beginPath();
    c.moveTo(cx - hw, by - lift);
    c.quadraticCurveTo(cx - hw * 0.75, by + h * 0.05, cx - hw * 0.45, by);
    c.lineTo(cx + hw * 0.45, by);
    c.quadraticCurveTo(cx + hw * 0.75, by + h * 0.05, cx + hw, by - lift);
    c.quadraticCurveTo(cx + hw * 0.68, by - h * 0.5, cx + hw * 0.6, by - h);
    c.lineTo(cx - hw * 0.6, by - h);
    c.quadraticCurveTo(cx - hw * 0.68, by - h * 0.5, cx - hw, by - lift);
    c.closePath();
    var g = c.createLinearGradient(0, by - h, 0, by); g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);

      var dr = Math.exp(-pt.dr * dt); pt.vx *= dr; pt.vy = pt.vy * dr + pt.g * dt;
      if (pt.t === 3) pt.x += Math.sin(now * 2 + pt.ph) * 30 * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.rot += pt.vr * dt;
    }
    for (i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }
    for (i = cracks.length - 1; i >= 0; i--) { cracks[i].life -= dt; if (cracks[i].life <= 0) cracks.splice(i, 1); }
    for (i = texts.length - 1; i >= 0; i--) { texts[i].life -= dt; texts[i].y -= 36 * dt; if (texts[i].life <= 0) texts.splice(i, 1); }

    // 위험 표시
    if (state === 'play' && ++hudCnt % 3 === 0) {
      var dp = Math.round(clamp(dangerShown, 0, 1) * 100);
      if (dp !== lastDp) {
        lastDp = dp;
        dangerBar.style.width = dp + '%';
        dangerBar.style.background = dp < 50 ? '#5fd38a' : (dp < 75 ? '#ffb52e' : '#ff4d5e');
        dangerTxt.textContent = (dp >= 75 ? '⚠ 위험! ' : '') + '가득참 ' + dp + '%';
        dangerEl.className = 'pill' + (dp >= 75 ? ' hot' : '');
      }
    }
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var sx = 0, sy = 0, i, b, t;
    if (shake > 0) { sx = (rand() - 0.5) * 2 * shake; sy = (rand() - 0.5) * 2 * shake; }
    if (prevCv && fadeA < 1) { ctx.drawImage(prevCv, -M + sx * 0.6, -M + sy * 0.6, W + 2 * M, H + 2 * M); ctx.globalAlpha = fadeA; }
    if (curCv) ctx.drawImage(curCv, -M + sx * 0.6, -M + sy * 0.6, W + 2 * M, H + 2 * M);
    ctx.globalAlpha = 1;
    if (fadeA >= 1) prevCv = null;

    if (state === 'play' || state === 'fail') {
      var dd = state === 'fail' ? 1 : dangerShown;
      if (dd > 0.6) {
        var a = clamp((dd - 0.6) / 0.4, 0, 1) * (0.34 + 0.16 * Math.sin(now * 9));
        var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
        vg.addColorStop(0, 'rgba(255,30,60,0)'); vg.addColorStop(1, 'rgba(255,30,60,' + a.toFixed(3) + ')');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      }
    }
    ctx.translate(sx, sy);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (i = 0; i < bubbles.length; i++) {
      b = bubbles[i];
      var q = clamp(b.sv * 0.03, -0.1, 0.1), wob = Math.sin(now * 3 + b.wp) * 0.03;
      var d = b.r * 2 * SPR_SCALE * Math.max(0.01, b.s), w = d * (1 + q + wob), h = d * (1 - q - wob);
      if (state === 'fail') { w *= 1 + Math.sin(now * 40 + b.wp) * 0.02; }
      ctx.drawImage(sprOf(b), b.x - w / 2, b.y - h / 2, w, h);
      if (b.type === 'rainbow') {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.globalAlpha = 0.85 + Math.sin(now * 5) * 0.15;
        star(0, 0, b.r * 0.5 * b.s, '#ffffff'); ctx.restore(); ctx.globalAlpha = 1;
      } else if (b.type === 'gold') {
        ctx.font = Math.round(b.r * 0.8 * b.s) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
        ctx.fillText('🚀', b.x, b.y + 2);
      }
    }

    for (i = 0; i < cracks.length; i++) {
      var ck = cracks[i]; t = ck.life / ck.max;
      var cd = ck.r * 2 * SPR_SCALE * (1 + 0.1 * (1 - t));
      ctx.globalAlpha = t; ctx.drawImage(ck.spr, ck.x - cd / 2, ck.y - cd / 2, cd, cd);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.2; ctx.beginPath();
      for (var s = 0; s < ck.segs.length; s++) {
        ctx.moveTo(ck.x, ck.y);
        for (var k = 0; k < ck.segs[s].length; k++) ctx.lineTo(ck.x + ck.segs[s][k][0], ck.y + ck.segs[s][k][1]);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < rings.length; i++) {
      var r = rings[i]; t = 1 - r.life / r.max;
      var e = 1 - (1 - t) * (1 - t);
      ctx.globalAlpha = (1 - t) * 0.8; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, PI2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < rockets.length; i++) {
      var rk = rockets[i], L = clamp(baseR * 0.8, 30, 50);
      ctx.save(); ctx.translate(rk.x, rk.y); ctx.rotate(rk.a);
      var fl = L * (0.4 + rand() * 0.3);
      var fg = ctx.createLinearGradient(-L * 0.5 - fl, 0, -L * 0.5, 0); fg.addColorStop(0, 'rgba(255,120,0,0)'); fg.addColorStop(1, 'rgba(255,240,150,1)');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-L * 0.45, -L * 0.1); ctx.lineTo(-L * 0.5 - fl, 0); ctx.lineTo(-L * 0.45, L * 0.1); ctx.fill();
      ctx.strokeStyle = '#7a4b2a'; ctx.lineWidth = L * 0.06; ctx.beginPath(); ctx.moveTo(-L * 0.5, 0); ctx.lineTo(L * 0.45, 0); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(-L * 0.5, 0); ctx.lineTo(-L * 0.62, -L * 0.13); ctx.lineTo(-L * 0.32, 0); ctx.lineTo(-L * 0.62, L * 0.13); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d62f2f'; ctx.fillRect(L * 0.04, -L * 0.09, L * 0.3, L * 0.18);
      ctx.fillStyle = '#ffd166'; ctx.fillRect(L * 0.1, -L * 0.09, L * 0.03, L * 0.18); ctx.fillRect(L * 0.24, -L * 0.09, L * 0.03, L * 0.18);
      ctx.fillStyle = '#c9ccd6'; ctx.beginPath(); ctx.moveTo(L * 0.62, 0); ctx.lineTo(L * 0.42, -L * 0.08); ctx.lineTo(L * 0.42, L * 0.08); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (rockets.length && pointer.active && (pointer.down || now - pointer.t < 1.2)) {
      var pr = 16 + Math.sin(now * 10) * 3;
      ctx.strokeStyle = 'rgba(255,70,70,.9)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, pr, 0, PI2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pointer.x - pr - 6, pointer.y); ctx.lineTo(pointer.x - pr + 6, pointer.y); ctx.moveTo(pointer.x + pr - 6, pointer.y); ctx.lineTo(pointer.x + pr + 6, pointer.y);
      ctx.moveTo(pointer.x, pointer.y - pr - 6); ctx.lineTo(pointer.x, pointer.y - pr + 6); ctx.moveTo(pointer.x, pointer.y + pr - 6); ctx.lineTo(pointer.x, pointer.y + pr + 6); ctx.stroke();
    }

    for (i = 0; i < parts.length; i++) {
      var p = parts[i], al = p.life / p.max;
      ctx.fillStyle = p.c;
      if (p.t === 0 || p.t === 4) {
        ctx.globalAlpha = al;
        if (p.s < 3) ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (0.5 + al * 0.5), 0, PI2); ctx.fill(); }
      } else if (p.t === 1) {
        ctx.globalAlpha = al < 0.4 ? al / 0.4 : 1;
        var cs = Math.cos(p.rot) * p.s, sn = Math.sin(p.rot) * p.s;
        ctx.beginPath(); ctx.moveTo(p.x + cs, p.y + sn);
        ctx.lineTo(p.x - sn * 0.6 - cs * 0.5, p.y + cs * 0.6 - sn * 0.5);
        ctx.lineTo(p.x + sn * 0.5 - cs * 0.6, p.y - cs * 0.5 - sn * 0.6); ctx.closePath(); ctx.fill();
      } else if (p.t === 2) {
        ctx.globalAlpha = al < 0.5 ? al * 2 : 1;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); star(0, 0, p.s * (0.5 + al * 0.5), p.c); ctx.restore();
      } else if (p.t === 3) {
        ctx.globalAlpha = Math.min(1, al * 3);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, PI2); ctx.fill(); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < texts.length; i++) {
      var x = texts[i]; t = 1 - x.life / x.max;
      var sc = t < 0.15 ? 0.6 + t / 0.15 * 0.55 : 1.15 - Math.min(1, (t - 0.15) / 0.2) * 0.15;
      ctx.globalAlpha = t > 0.6 ? (1 - t) / 0.4 : 1;
      ctx.font = '800 ' + Math.round(x.size * sc) + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      ctx.lineWidth = Math.max(3, x.size * 0.18); ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(x.str, x.x, x.y);
      ctx.fillStyle = x.color; ctx.fillText(x.str, x.x, x.y);
    }
    ctx.globalAlpha = 1;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (banner) {
      var bt = banner.t, bdur = banner.dur;
      var bs = bt < 0.3 ? 0.4 + bt / 0.3 * 0.75 : (bt < 0.45 ? 1.15 - (bt - 0.3) / 0.15 * 0.15 : 1);
      ctx.globalAlpha = bt > bdur - 0.4 ? (bdur - bt) / 0.4 : 1;
      var fs = clamp(Math.min(W, H) * 0.12, 38, 92);
      ctx.font = '900 ' + Math.round(fs) + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      var tw = ctx.measureText(banner.str).width; if (tw > W * 0.9) fs *= W * 0.9 / tw;
      fs *= bs;
      var y0 = TOP + (H - TOP) * 0.38;
      ctx.font = '900 ' + Math.round(fs) + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
      ctx.lineJoin = 'round'; ctx.lineWidth = fs * 0.17; ctx.strokeStyle = 'rgba(255,255,255,.96)';
      ctx.strokeText(banner.str, W / 2, y0); ctx.fillStyle = banner.color; ctx.fillText(banner.str, W / 2, y0);
      if (banner.sub) {
        var fs2 = clamp(Math.min(W, H) * 0.045, 16, 28);
        ctx.font = '800 ' + Math.round(fs2) + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
        var tw2 = ctx.measureText(banner.sub).width; if (tw2 > W * 0.92) { fs2 *= W * 0.92 / tw2; ctx.font = '800 ' + Math.round(fs2) + 'px "Malgun Gothic","Apple SD Gothic Neo",sans-serif'; }
        ctx.lineWidth = fs2 * 0.3; ctx.strokeText(banner.sub, W / 2, y0 + fs * 0.75 + 4); ctx.fillStyle = '#4b3f6b'; ctx.fillText(banner.sub, W / 2, y0 + fs * 0.75 + 4);
      }
      ctx.globalAlpha = 1;
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(' + flashCol + ',' + (flash * 0.6).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  var last = 0, ema = 1 / 60, slowT = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) { last = ts; return; }
    var raw = (ts - last) / 1000; last = ts;
    var dt = Math.min(raw, 0.05);
    if (raw < 0.25 && !document.hidden) {                // 느린 기기면 효과량을 자동으로 줄임
      ema += (raw - ema) * 0.05;
      if (ema > 1 / 40) slowT += raw; else slowT = Math.max(0, slowT - raw);
      if (slowT > 3 && quality > 0.4) { quality = Math.max(0.4, quality - 0.2); slowT = 0; resize(); }
    }
    tick(dt); draw();
  }
  function tick(dt) {
    if (window.innerWidth !== W || window.innerHeight !== H) resize();
    if (sceneDirty && now - resizeAt > 0.2) { sceneDirty = false; sceneCache = {}; curCv = sceneCanvas(curIdx); prevCv = null; fadeA = 1; }
    update(dt);
  }

  resize();
  requestAnimationFrame(frame);

  // 점검용 (게임에는 영향 없음)
  window.__gp = {
    info: function () {
      return { W: W, H: H, TOP: TOP, state: state, stage: stage, popped: popped, goal: goal, score: score, combo: combo, ammo: ammo,
        fill: +fill.toFixed(3), quality: quality, bubbles: bubbles.length, parts: parts.length, rockets: rockets.length, scene: SCENES[curIdx].name,
        audio: ac ? ac.state : 'none', bgm: bgm.playing, bgmOn: bgmOn, sfxOn: sfxOn, vol: vol, clearStep: clearStep, failStep: failStep,
        list: bubbles.slice(0, 30).map(function (b) { return { x: Math.round(b.x), y: Math.round(b.y), r: Math.round(b.r), t: b.type }; }) };
    },
    setPopped: function (n) { popped = n; updHUD(); },
    flood: function (n) { for (var i = 0; i < n; i++) spawn(); },
    scene: function (i) { setScene(i, true); },
    step: function (sec) { for (var i = 0; i < Math.round(sec * 60); i++) tick(1 / 60); draw(); },
    aim: function (x, y, down) { pointer.x = x; pointer.y = y; pointer.t = now; pointer.active = true; pointer.down = !!down; }
  };
})();
</script>
</body>
</html>
